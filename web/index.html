<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">
    <title>Becoming Many</title>
    <!-- Share preview: what a link shows in messengers and social media. -->
    <meta
      name="description"
      content="An immersive journey through non-human perception. Fly through a white world of particles and borrow the senses of animals, in your browser, on your phone or in VR."
    >
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Becoming Many">
    <meta property="og:title" content="Becoming Many">
    <meta
      property="og:description"
      content="An immersive journey through non-human perception. Fly through a white world of particles, in your browser, on your phone or in VR."
    >
    <meta property="og:url" content="%SITE_URL%">
    <meta property="og:image" content="%SITE_URL%share.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta
      property="og:image:alt"
      content="Becoming Many: an immersive journey through non-human perception"
    >
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="de_DE">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="%SITE_URL%share.png">
    <link rel="canonical" href="%SITE_URL%">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/screens.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/app.css">
  </head>
  <body>
    <!-- The real experience renders here from the start; the menu draws its
         particles into the same world. -->
    <main class="app-show" data-show-viewport hidden>
      <canvas class="app-show__canvas" data-show-canvas></canvas>
    </main>
    <p class="app-error" role="alert" data-startup-error hidden>
      Becoming Many could not start. Please reload the page.
    </p>

    <h1 class="bm-title" data-title>Becoming Many</h1>

    <section class="screen load" data-screen="loading">
      <div class="load__readout">
        <p class="load__building" data-building-line aria-live="polite"></p>
      </div>
      <p class="load__enter" data-continue data-i18n-enter></p>
    </section>

    <section class="screen menu" data-screen="menu">
      <a
        class="menu__version"
        href="https://github.com/Strehk/becoming-many/releases"
        target="_blank"
        rel="noopener"
        data-version
        hidden
        >Releases</a
      >
      <nav class="list">
        <button
          type="button"
          class="item item--primary"
          data-action="start"
          data-i18n="begin"
        >
          Starten
        </button>
        <button
          type="button"
          class="item"
          data-action="settings"
          data-i18n="settings"
        >
          Einstellungen
        </button>
        <button
          type="button"
          class="item"
          data-action="credits"
          data-i18n="credits"
        >
          Credits
        </button>
      </nav>
      <p class="hint" data-hint></p>
    </section>

    <section class="screen glow" data-screen="settings">
      <h2 class="heading" data-i18n="settings">Einstellungen</h2>
      <div class="panel" data-settings-slot></div>
      <!-- Inside the experience: the piece as one line of chapters; a click
           anywhere on it jumps there. -->
      <div class="app-timeline" data-timeline>
        <div class="app-timeline__head">
          <span class="app-timeline__label" data-i18n="jumpTo"></span>
          <span class="app-timeline__readout">
            <span class="app-timeline__chapter" data-timeline-chapter></span>
            <output class="app-timeline__time" data-timeline-time></output>
          </span>
        </div>
        <div
          class="app-timeline__track"
          role="slider"
          tabindex="0"
          aria-label="Timeline"
          aria-valuemin="0"
          aria-valuemax="525"
          aria-valuenow="0"
          data-timeline-track
        >
          <span class="app-timeline__playhead" data-timeline-playhead></span>
        </div>
        <template data-segment-template>
          <span class="app-timeline__segment">
            <span class="app-timeline__fill"></span>
          </span>
        </template>
      </div>
      <div class="app-settings__actions">
        <button
          type="button"
          class="back"
          data-action="back"
          data-i18n="back"
        ></button>
        <button
          type="button"
          class="back app-settings__exit"
          data-action="exit"
          data-i18n="exitToMenu"
        ></button>
      </div>
    </section>

    <!-- Inside the experience: a gear for the settings and a first hint. -->
    <section class="screen app-in-show" data-screen="show">
      <button
        type="button"
        class="app-gear"
        data-action="settings"
        aria-label="Settings"
        data-i18n-label="settings"
      >
        <!-- lucide "settings", ISC licence -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
          ></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>

      <!-- With the autopilot on, a small mark beside the gear; it fades
           while the visitor steers and leads to the settings. -->
      <button
        type="button"
        class="app-autopilot"
        data-action="settings"
        data-autopilot-mark
      >
        <!-- lucide "navigation", ISC licence -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
        </svg>
        <span data-i18n="autopilot"></span>
      </button>

      <!-- The opening, once: headphones in the silence before the voice,
           then how to fly. -->
      <div class="app-intro app-intro--sound" data-intro-sound>
        <!-- lucide "headphones", ISC licence -->
        <svg class="app-intro__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"
          ></path>
        </svg>
        <p class="launch__text" data-i18n="introSound"></p>
        <p class="app-intro__next" data-intro-next></p>
      </div>
      <div class="app-intro app-intro--keys">
        <div class="app-keys" aria-hidden="true">
          <span class="app-keys__group">
            <span class="app-key app-key--up">W</span>
            <span class="app-key app-key--left">A</span>
            <span class="app-key app-key--down">S</span>
            <span class="app-key app-key--right">D</span>
          </span>
          <span class="app-keys__or" data-i18n="or"></span>
          <span class="app-keys__group app-keys__group--arrows">
            <span class="app-key app-key--up"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 15 6-6 6 6"></path>
              </svg></span
            >
            <span class="app-key app-key--left"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 15 6-6 6 6"></path>
              </svg></span
            >
            <span class="app-key app-key--down"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 15 6-6 6 6"></path>
              </svg></span
            >
            <span class="app-key app-key--right"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 15 6-6 6 6"></path>
              </svg></span
            >
          </span>
        </div>
        <p class="launch__text" data-i18n="introKeys"></p>
        <p class="app-intro__next" data-intro-next></p>
      </div>
      <div class="app-intro app-intro--tilt">
        <!-- lucide "smartphone", ISC licence; it rocks to show the tilt -->
        <svg
          class="app-intro__icon app-tilt"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect>
          <path d="M12 18h.01"></path>
        </svg>
        <p class="launch__text" data-i18n="introTilt" data-tilt-text></p>
        <p class="app-intro__next" data-intro-next></p>
      </div>
      <div class="app-intro app-intro--camera">
        <!-- A figure with its arms as wings, going through all five
             positions: straight, left, right, climb, sink. -->
        <svg
          class="app-intro__icon app-intro__icon--figure"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 8v7M12 15l-3 6M12 15l3 6"></path>
          <g class="app-wings">
            <path class="app-wing app-wing--left" d="M12 10H3"></path>
            <path class="app-wing app-wing--right" d="M12 10h9"></path>
          </g>
        </svg>
        <p class="launch__text" data-i18n="introCamera"></p>
        <p class="app-intro__next" data-intro-next></p>
      </div>

      <!-- Camera controls: the five positions as small figures, the one
           seen now in ink, over a small grey mirror with the wings drawn
           in. Both can be hidden; a small camera button brings them back. -->
      <div class="app-camera">
        <div class="app-camera__panel">
          <div class="app-camera__poses">
            <span class="app-pose" data-pose="left">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="4.5" r="1.8"></circle>
                <path d="M12 7v7M12 14l-2.5 6M12 14l2.5 6"></path>
                <path d="M4 12.5L20 6.5"></path>
              </svg>
              <span class="app-pose__label" data-i18n="poseLeft"></span>
            </span>
            <span class="app-pose" data-pose="straight">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="4.5" r="1.8"></circle>
                <path d="M12 7v7M12 14l-2.5 6M12 14l2.5 6"></path>
                <path d="M3.5 9.5h17"></path>
              </svg>
              <span class="app-pose__label" data-i18n="poseStraight"></span>
            </span>
            <span class="app-pose" data-pose="right">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="4.5" r="1.8"></circle>
                <path d="M12 7v7M12 14l-2.5 6M12 14l2.5 6"></path>
                <path d="M4 6.5L20 12.5"></path>
              </svg>
              <span class="app-pose__label" data-i18n="poseRight"></span>
            </span>
            <span class="app-pose" data-pose="up">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="4.5" r="1.8"></circle>
                <path d="M12 7v7M12 14l-2.5 6M12 14l2.5 6"></path>
                <path d="M5 4l7 5.5 7-5.5"></path>
              </svg>
              <span class="app-pose__label" data-i18n="poseUp"></span>
            </span>
            <span class="app-pose" data-pose="down">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="4.5" r="1.8"></circle>
                <path d="M12 7v7M12 14l-2.5 6M12 14l2.5 6"></path>
                <path d="M5 14l7-4.5 7 4.5"></path>
              </svg>
              <span class="app-pose__label" data-i18n="poseDown"></span>
            </span>
          </div>
          <div class="app-camera__frame">
            <canvas
              class="app-camera__mirror"
              width="400"
              height="300"
              data-camera-preview
            ></canvas>
            <button
              type="button"
              class="app-camera__hide"
              data-camera-toggle
              data-i18n-label="cameraHide"
            >
              <!-- lucide "eye-off", ISC licence -->
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"
                ></path>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                <path
                  d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"
                ></path>
                <path d="m2 2 20 20"></path>
              </svg>
            </button>
          </div>
          <p class="app-camera__note app-camera__note--starting">
            <span data-i18n="cameraStarting"></span>
          </p>
          <p class="app-camera__note app-camera__note--denied">
            <span data-i18n="cameraDenied"></span>
          </p>
        </div>
        <button
          type="button"
          class="app-camera__show"
          data-camera-toggle
          data-i18n-label="cameraShow"
        >
          <!-- lucide "camera", ISC licence -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"
            ></path>
            <circle cx="12" cy="13" r="3"></circle>
          </svg>
        </button>
      </div>
    </section>

    <!-- The piece's end: the title forms again over its credits. -->
    <section class="screen glow app-ending" data-screen="ending">
      <div data-credits-slot></div>
      <button
        type="button"
        class="back"
        data-action="exit"
        data-i18n="exitToMenu"
      ></button>
    </section>

    <section class="screen glow" data-screen="credits">
      <div data-credits-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen glow legal" data-screen="imprint">
      <div class="legal__body" data-legal="imprint"></div>
      <button
        type="button"
        class="back"
        data-action="return"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen glow legal" data-screen="privacy">
      <div class="legal__body" data-legal="privacy"></div>
      <button
        type="button"
        class="back"
        data-action="return"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen glow" data-screen="modes">
      <h2 class="heading" data-i18n="modes">Wie möchtest du eintreten?</h2>
      <div data-modes-slot></div>
      <p class="hint" data-hint></p>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="launch">
      <p class="launch__mode" data-launch-title></p>
      <p class="launch__text" data-launch-text></p>
      <p class="launch__gyro" data-gyro-readout></p>
      <button
        type="button"
        class="item item--primary"
        data-vr-enter
        data-i18n="vrEnter"
        hidden
      ></button>
      <button
        type="button"
        class="back"
        data-action="menu"
        data-i18n="backToMenu"
      ></button>
    </section>

    <!-- Legal notice and privacy, one click away from every menu screen
         (inside the experience: gear, then here). -->
    <nav class="legal-links" aria-label="Legal" data-i18n-label="legal">
      <button type="button" data-action="imprint" data-i18n="imprint"></button>
      <span aria-hidden="true">·</span>
      <button type="button" data-action="privacy" data-i18n="privacy"></button>
    </nav>

    <script type="module" src="./main.js"></script>
  </body>
</html>
