# Purpose: Start one Becoming Many station with a single command.
# Context: Runs on each station PC; the pages must come from http://localhost
#   (docs/direction/deployment.md), so this publishes a local port, not a host.
# Responsibility: Build the image, pass the per-station env through, keep the
#   process restarted, and offer the M5 simulator for hardware-less testing.
# Boundary: Per-station values live in `.env` (see .env.example), never here.
#
#   docker compose up -d --build          # the station
#   docker compose --profile sim up -d    # station + simulated M5

services:
  station:
    # The release workflow publishes this name; a station without the build
    # toolchain runs `docker compose pull && docker compose up -d`, while
    # `docker compose up -d --build` builds the same image locally.
    image: ghcr.io/strehk/becoming-many:latest
    build: .
    ports:
      - "${HOST_PORT:-80}:7823"
    environment:
      M5_HOST: ${M5_HOST:-}
      M5_DEVICE_ID: ${M5_DEVICE_ID:-}
      STATION_NAME: ${STATION_NAME:-}
    restart: unless-stopped

  # A stand-in M5 controller answering GET /state with a slow tilt sweep.
  # The browser does the polling, so it must reach the simulator through the
  # host: set M5_HOST=localhost:5183 in .env when using this profile.
  m5-sim:
    profiles: ["sim"]
    image: ghcr.io/strehk/becoming-many:latest
    build: .
    command: ["bun", "station/m5-sim.ts"]
    ports:
      - "${SIM_PORT:-5183}:5183"
    restart: unless-stopped
    # The image's healthcheck probes the station's /health; this process
    # serves /state instead.
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:5183/state').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
