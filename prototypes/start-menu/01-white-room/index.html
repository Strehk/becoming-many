<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">
    <title>White Room · Becoming Many</title>
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="../shared/screens.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <canvas class="bm-canvas" data-canvas></canvas>

    <section class="screen screen--center" data-screen="loading">
      <h1 class="title">Becoming Many</h1>
      <div class="bar" aria-hidden="true"><span class="bar__fill"></span></div>
      <p class="stage">
        <span data-progress-stage></span>
        <span class="stage__value"><span data-progress-value>00</span>%</span>
      </p>
      <p class="continue" data-continue data-i18n-continue></p>
    </section>

    <section class="screen screen--center" data-screen="menu">
      <h1 class="title">Becoming Many</h1>
      <nav class="menu">
        <button
          type="button"
          class="menu__item"
          data-action="start"
          data-i18n="begin"
        ></button>
        <button
          type="button"
          class="menu__item"
          data-action="settings"
          data-i18n="settings"
        ></button>
        <button
          type="button"
          class="menu__item"
          data-action="credits"
          data-i18n="credits"
        ></button>
      </nav>
    </section>

    <section class="screen screen--center" data-screen="settings">
      <h2 class="heading" data-i18n="settings">Einstellungen</h2>
      <div class="panel" data-settings-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen screen--center" data-screen="credits">
      <div data-credits-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen screen--center" data-screen="modes">
      <h2 class="heading" data-i18n="modes">Wie möchtest du eintreten?</h2>
      <div data-modes-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen screen--center" data-screen="launch">
      <p class="launch__mode" data-launch-title></p>
      <p class="launch__text" data-launch-text></p>
      <p class="launch__gyro" data-gyro-readout></p>
      <p class="launch__note" data-launch-note></p>
      <button
        type="button"
        class="back"
        data-action="menu"
        data-i18n="backToMenu"
      ></button>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
