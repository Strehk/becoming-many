<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">
    <title>Rings · Becoming Many</title>
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="../shared/screens.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <canvas class="bm-canvas" data-canvas></canvas>

    <section data-screen="loading">
      <div class="core">
        <p class="core__value"><span data-progress-value>00</span></p>
        <p class="core__stage" data-progress-stage></p>
      </div>
      <p class="continue continue--bottom" data-continue data-i18n-continue></p>
    </section>

    <section data-screen="menu">
      <h1 class="title">BECOMING MANY</h1>
      <button
        type="button"
        class="ring-label"
        data-ring="0"
        data-action="start"
        data-i18n="begin"
      ></button>
      <button
        type="button"
        class="ring-label"
        data-ring="1"
        data-action="settings"
        data-i18n="settings"
      ></button>
      <button
        type="button"
        class="ring-label"
        data-ring="2"
        data-action="credits"
        data-i18n="credits"
      ></button>
    </section>

    <section class="screen" data-screen="settings">
      <h2 class="heading" data-i18n="settings">Einstellungen</h2>
      <div class="panel" data-settings-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="credits">
      <div data-credits-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="modes">
      <h2 class="heading" data-i18n="modes">Wie möchtest du eintreten?</h2>
      <div data-modes-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="launch">
      <p class="launch__mode" data-launch-title></p>
      <p class="launch__text" data-launch-text></p>
      <p class="launch__gyro" data-gyro-readout></p>
      <p class="launch__note" data-launch-note></p>
      <button
        type="button"
        class="back"
        data-action="menu"
        data-i18n="backToMenu"
      ></button>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
