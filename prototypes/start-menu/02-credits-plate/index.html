<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">
    <title>Credits Plate · Becoming Many</title>
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="../shared/screens.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <canvas class="bm-canvas" data-canvas></canvas>

    <section data-screen="loading">
      <div class="plate">
        <h1 class="plate__title">BECOMING MANY</h1>
        <div class="plate__lines">
          <p class="plate__role">
            <span data-i18n="loading"></span>
            <span data-progress-value>00</span>%
          </p>
          <ol class="stages" data-stage-list></ol>
          <p class="plate__continue" data-continue data-i18n-continue></p>
        </div>
      </div>
    </section>

    <section data-screen="menu">
      <div class="plate">
        <h1 class="plate__title">BECOMING MANY</h1>
        <nav class="plate__lines">
          <p class="plate__role" data-i18n="menu"></p>
          <button
            type="button"
            class="plate__name"
            data-action="start"
            data-i18n="begin"
          ></button>
          <button
            type="button"
            class="plate__name"
            data-action="settings"
            data-i18n="settings"
          ></button>
          <button
            type="button"
            class="plate__name"
            data-action="credits"
            data-i18n="credits"
          ></button>
        </nav>
      </div>
    </section>

    <section data-screen="credits">
      <div class="plate">
        <h1 class="plate__title">BECOMING MANY</h1>
        <div class="plate__lines">
          <p class="plate__role" data-i18n="creditsRole"></p>
          <p class="plate__name">Erasmus Schmidt</p>
          <p class="plate__name">Tade Strehk</p>
          <p class="plate__name">Eddie Huesmann</p>
          <button
            type="button"
            class="plate__back"
            data-action="back"
            data-i18n="back"
          ></button>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="settings">
      <p class="plate__role" data-i18n="settings"></p>
      <div class="panel" data-settings-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="modes">
      <p class="plate__role" data-i18n="modes"></p>
      <div data-modes-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section data-screen="launch">
      <div class="plate">
        <h1 class="plate__title" data-launch-title>Desktop</h1>
        <div class="plate__lines">
          <p class="plate__role" data-launch-note></p>
          <p class="plate__text" data-launch-text></p>
          <p class="plate__role" data-gyro-readout></p>
          <button
            type="button"
            class="plate__back"
            data-action="menu"
            data-i18n="backToMenu"
          ></button>
        </div>
      </div>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
