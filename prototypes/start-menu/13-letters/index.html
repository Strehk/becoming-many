<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">
    <title>Letters · Becoming Many</title>
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="../shared/screens.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <canvas class="bm-canvas" data-canvas></canvas>

    <h1 class="bm-title" data-title>Becoming Many</h1>

    <section class="screen load" data-screen="loading">
      <div class="load__readout">
        <p class="load__building" data-building-line aria-live="polite"></p>
      </div>
      <p class="load__enter" data-continue data-i18n-enter></p>
    </section>

    <section class="screen menu" data-screen="menu">
      <a
        class="menu__version"
        href="https://github.com/Strehk/becoming-many/releases"
        target="_blank"
        rel="noopener"
        data-version
        hidden
        >Releases</a
      >
      <nav class="list">
        <button
          type="button"
          class="item item--primary"
          data-action="start"
          data-i18n="begin"
        >
          Beginnen
        </button>
        <button
          type="button"
          class="item"
          data-action="settings"
          data-i18n="settings"
        >
          Einstellungen
        </button>
        <button
          type="button"
          class="item"
          data-action="credits"
          data-i18n="credits"
        >
          Credits
        </button>
      </nav>
      <p class="hint" data-hint></p>
    </section>

    <section class="screen glow" data-screen="settings">
      <h2 class="heading" data-i18n="settings">Einstellungen</h2>
      <div class="panel" data-settings-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen glow" data-screen="credits">
      <div data-credits-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen glow" data-screen="modes">
      <h2 class="heading" data-i18n="modes">Wie möchtest du eintreten?</h2>
      <div data-modes-slot></div>
      <p class="hint" data-hint></p>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="launch">
      <p class="launch__mode" data-launch-title></p>
      <p class="launch__text" data-launch-text></p>
      <p class="launch__gyro" data-gyro-readout></p>
      <p class="launch__note" data-launch-note></p>
      <button
        type="button"
        class="back"
        data-action="menu"
        data-i18n="backToMenu"
      ></button>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
