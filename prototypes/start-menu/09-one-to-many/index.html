<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">
    <title>One to Many · Becoming Many</title>
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="../shared/screens.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <canvas class="bm-canvas" data-canvas></canvas>

    <section data-screen="loading">
      <p class="corner corner--left">BECOMING MANY</p>
      <p class="corner corner--right">
        <span data-progress-stage></span>
        <span class="corner__value"><span data-progress-value>00</span>%</span>
      </p>
      <p
        class="continue corner corner--bottom"
        data-continue
        data-i18n-continue
      ></p>
    </section>

    <section data-screen="menu">
      <p class="corner corner--left">BECOMING MANY</p>
      <button
        type="button"
        class="hold"
        data-action="start"
        data-hold="1400"
        data-autofocus
      >
        <span class="hold__ring" aria-hidden="true"></span>
        <span class="hold__label" data-i18n="begin"></span>
        <span class="hold__hint" data-i18n="hold"></span>
      </button>
      <nav class="corner corner--bottom corner--links">
        <button
          type="button"
          class="link"
          data-action="settings"
          data-i18n="settings"
        ></button>
        <button
          type="button"
          class="link"
          data-action="credits"
          data-i18n="credits"
        ></button>
      </nav>
    </section>

    <section class="screen" data-screen="settings">
      <h2 class="heading" data-i18n="settings">Einstellungen</h2>
      <div class="panel" data-settings-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="credits">
      <div class="panel panel--credits" data-credits-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="modes">
      <h2 class="heading" data-i18n="modes">Wie möchtest du eintreten?</h2>
      <div data-modes-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="launch">
      <p class="launch__mode" data-launch-title></p>
      <p class="launch__text" data-launch-text></p>
      <p class="launch__gyro" data-gyro-readout></p>
      <p class="launch__note" data-launch-note></p>
      <button
        type="button"
        class="back"
        data-action="menu"
        data-i18n="backToMenu"
      ></button>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
