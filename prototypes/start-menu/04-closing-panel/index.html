<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">
    <title>Closing Panel · Becoming Many</title>
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="../shared/screens.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <canvas class="bm-canvas" data-canvas></canvas>

    <section data-screen="loading">
      <div class="plate">
        <h1 class="plate__title">BECOMING MANY</h1>
        <div class="plate__lines">
          <p class="plate__role">
            <span data-i18n="loading"></span>
            <span data-progress-value>00</span>
            %
          </p>
          <ol class="stages" data-stage-list></ol>
          <p class="plate__continue" data-continue data-i18n-continue></p>
        </div>
      </div>
    </section>

    <section data-screen="menu">
      <div class="plate">
        <h1 class="plate__title">BECOMING MANY</h1>
        <nav class="plate__lines">
          <p class="plate__role" data-i18n="menu">Menü</p>
          <button
            type="button"
            class="plate__name"
            data-action="start"
            data-i18n="begin"
          >
            Beginnen
          </button>
          <button
            type="button"
            class="plate__name"
            data-action="settings"
            data-i18n="settings"
          >
            Einstellungen
          </button>
          <button
            type="button"
            class="plate__name"
            data-action="credits"
            data-i18n="credits"
          >
            Credits
          </button>
          <p class="hint plate__hint" data-hint></p>
        </nav>
      </div>
    </section>

    <section class="screen glow" data-screen="settings">
      <h2 class="heading" data-i18n="settings">Einstellungen</h2>
      <div class="panel" data-settings-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen glow" data-screen="credits">
      <div data-credits-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen glow" data-screen="modes">
      <h2 class="heading" data-i18n="modes">Wie möchtest du eintreten?</h2>
      <div data-modes-slot></div>
      <p class="hint" data-hint></p>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="launch">
      <p class="launch__mode" data-launch-title></p>
      <p class="launch__text" data-launch-text></p>
      <p class="launch__gyro" data-gyro-readout></p>
      <p class="launch__note" data-launch-note></p>
      <button
        type="button"
        class="back"
        data-action="menu"
        data-i18n="backToMenu"
      ></button>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
