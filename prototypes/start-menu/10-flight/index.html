<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">
    <title>Flight · Becoming Many</title>
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="../shared/screens.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <canvas class="bm-canvas" data-canvas></canvas>
    <div class="flash" aria-hidden="true"></div>
    <div class="reticle" aria-hidden="true"></div>
    <p class="hud hud--brand">BECOMING MANY</p>

    <section data-screen="loading">
      <div class="hud hud--readout">
        <p class="hud__big">
          <span data-progress-value>00</span><span class="hud__unit">%</span>
        </p>
        <p class="hud__small" data-progress-stage></p>
        <div class="hud__bar"><span></span></div>
        <p class="continue hud__continue" data-continue data-i18n-continue></p>
      </div>
    </section>

    <section data-screen="menu">
      <nav class="hud hud--menu">
        <button type="button" class="hud__item" data-action="start">
          <span class="hud__key">01</span><span data-i18n="begin"></span>
        </button>
        <button type="button" class="hud__item" data-action="settings">
          <span class="hud__key">02</span><span data-i18n="settings"></span>
        </button>
        <button type="button" class="hud__item" data-action="credits">
          <span class="hud__key">03</span><span data-i18n="credits"></span>
        </button>
      </nav>
    </section>

    <section class="drawer" data-screen="settings">
      <h2 class="heading" data-i18n="settings">Einstellungen</h2>
      <div data-settings-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="drawer" data-screen="credits">
      <div data-credits-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen screen--modes" data-screen="modes">
      <h2 class="heading" data-i18n="modes">Wie möchtest du eintreten?</h2>
      <div data-modes-slot></div>
      <button
        type="button"
        class="back"
        data-action="back"
        data-i18n="back"
      ></button>
    </section>

    <section class="screen" data-screen="launch">
      <p class="launch__mode" data-launch-title></p>
      <p class="launch__text" data-launch-text></p>
      <p class="launch__gyro" data-gyro-readout></p>
      <p class="launch__note" data-launch-note></p>
      <button
        type="button"
        class="back"
        data-action="menu"
        data-i18n="backToMenu"
      ></button>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
