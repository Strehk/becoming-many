<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./app.css">
    <title>Becoming Many — Test</title>
  </head>
  <body>
    <main class="app">
      <canvas class="experience-canvas"></canvas>
      <p role="alert" data-startup-error hidden>
        Unable to start Becoming Many. Please reload.
      </p>
      <aside
        class="diagnostics-overlay"
        aria-label="Diagnostics"
        data-diagnostics
        hidden
      >
        <section
          class="diagnostics-overlay__metrics"
          aria-label="Performance metrics"
          data-metrics
          hidden
        >
          <div class="diagnostics-overlay__card">
            <span class="diagnostics-overlay__label">FPS</span>
            <output class="diagnostics-overlay__value" data-metric="fps"
              >--</output
            >
          </div>
          <div class="diagnostics-overlay__card">
            <span class="diagnostics-overlay__label">P95</span>
            <output class="diagnostics-overlay__value" data-metric="p95"
              >--</output
            >
          </div>
          <div class="diagnostics-overlay__card">
            <span class="diagnostics-overlay__label">DRAW CALLS</span>
            <output class="diagnostics-overlay__value" data-metric="draw-calls"
              >--</output
            >
          </div>
          <div class="diagnostics-overlay__card">
            <span class="diagnostics-overlay__label">DREIECKE</span>
            <output class="diagnostics-overlay__value" data-metric="triangles"
              >--</output
            >
          </div>
        </section>
        <pre
          class="diagnostics-overlay__log"
          data-headset-diagnostics
          hidden
        ></pre>
      </aside>
    </main>
    <button type="button" class="xr-entry-button" data-xr-entry hidden disabled>
      VR not available
    </button>
    <script type="module" src="../entry/test.entry.ts"></script>
  </body>
</html>
