; Purpose: PlatformIO build definition for the Becoming Many M5StickS3 controller.
; Context: The M5StickS3 carries an ESP32-S3-PICO-1-N8R8 (8MB flash, 8MB octal
;   PSRAM) with native USB; there is no dedicated PlatformIO board definition,
;   so the official examples' generic S3 board plus 8MB partitions is used.
;   The official espressif32 platform stopped at Arduino core 2.x, which
;   predates the StickS3 — the community pioarduino platform carries the
;   Arduino core 3.x that M5Stack actually tests this board against.
; Responsibility: Build firmware when a human runs PlatformIO; nothing in the
;   web toolchain depends on this file.

[env:m5stick-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    ; The StickS3 has native USB only; route Serial to the USB CDC port so the
    ; newline-JSON setup channel works over the one Type-C connector, and keep
    ; the mass-storage and DFU boot modes off the same port.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
lib_deps =
    ; M5Unified >= 0.2.12 and M5GFX >= 0.2.18 are the first releases that know
    ; the StickS3 board (BMI270 IMU, ST7789P3 display, M5PM1 power chip).
    m5stack/M5Unified@^0.2.12
    m5stack/M5GFX@^0.2.18
    bblanchon/ArduinoJson@^7.0.0
