<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Becoming Many</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
    @font-face {
      font-family: Rubik;
      font-weight: 300 900;
      font-display: swap;
      src: url("/fonts/rubik/rubik-latin.woff2") format("woff2");
    }
    html {
      background: #fff;
      color: #202126;
      font-family: Rubik, system-ui, sans-serif;
    }
    body {
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 18px;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(30px, 6vw, 64px);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    p {
      max-width: 42ch;
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: #6b6c72;
    }
    a {
      margin-top: 8px;
      padding: 9px 14px;
      border: 1px solid #202126;
      background: #202126;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
    }
    a:hover,
    a:focus-visible {
      background: #fff;
      color: #202126;
      outline: none;
    }
    </style>
  </head>
  <body>
    <h1>Becoming Many</h1>
    <p>
      This page drifted off into the air. The piece itself is just one click
      away.
    </p>
    <p lang="de">
      Diese Seite ist davongeflogen. Das Stück selbst ist nur einen Klick
      entfernt.
    </p>
    <a href="/">Becoming Many</a>
  </body>
</html>
