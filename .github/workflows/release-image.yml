# Purpose: Publish the station container image when a release is published.
# Context: A station PC runs `docker compose pull` instead of carrying the
#   build toolchain; the Dockerfile runs the full build gate itself, so a
#   green image is a typechecked, bundled build.
# Responsibility: Build the image once per release and push it to GHCR with
#   semver tags plus `latest`.
# Boundary: What the image contains is the Dockerfile's decision; per-station
#   facts stay in each station's `.env`, never in the image.

name: Release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 builds run emulated; the in-image typecheck and bundle make the
      # release a few minutes slower, which a release can afford.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release tag like v1.2.0 becomes 1.2.0, 1.2, 1, and latest; a
      # non-semver tag falls through to its literal name.
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=raw,value=latest

      # amd64 for the x86 station PCs, arm64 so `docker compose up -d`
      # also pulls cleanly on Apple-silicon development machines.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
