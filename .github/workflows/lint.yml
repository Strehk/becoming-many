# Purpose: Hold the Biome formatting and lint gate on every pull request.
# Context: `biome check` is one command covering formatting, lint rules, and
#   import assist, so splitting formatting from linting would only run the
#   same analysis twice.
# Responsibility: Run the repository's own `bun run lint`, reported as inline
#   annotations on the changed lines.
# Boundary: Which rules apply is biome.json's decision, not this workflow's.

name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded pull-request run tells nobody anything; a main run is the record
# of that commit and runs to completion.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # `--reporter=github` turns findings into file-anchored annotations; the
      # exit code is unchanged, so the gate still blocks.
      - run: bun run lint --reporter=github
